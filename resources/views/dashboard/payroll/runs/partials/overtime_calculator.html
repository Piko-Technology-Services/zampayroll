<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overtime Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="card shadow">

        <div class="card-header">
            <h3 class="mb-0">Weekly Overtime Calculator</h3>
        </div>

        <div class="card-body">

            <div class="row mb-4">

                <div class="col-md-4">
                    <label class="form-label">Basic Pay</label>
                    <input type="number"
                           id="basicPay"
                           class="form-control"
                           value="8000">
                </div>

                <div class="col-md-4">
                    <label class="form-label">
                        Normal OT Multiplier
                    </label>
                    <input type="number"
                           id="otMultiplier"
                           class="form-control"
                           value="1.5"
                           step="0.1">
                </div>

                <div class="col-md-4 d-flex align-items-end">
                    <button class="btn btn-primary w-100"
                            onclick="calculateOvertime()">
                        Calculate Overtime
                    </button>
                </div>

            </div>

            <div class="table-responsive">

                <table class="table table-bordered align-middle">

                    <thead class="table-light">
                        <tr>
                            <th>Day</th>
                            <th>Shift Start</th>
                            <th>Shift End</th>
                            <th>Actual Start</th>
                            <th>Actual End</th>
                            <th>Scheduled Hrs</th>
                            <th>Worked Hrs</th>
                            <th>OT Hrs</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr>
                            <td>Monday</td>
                            <td><input type="time" class="form-control sched-start" value="08:00"></td>
                            <td><input type="time" class="form-control sched-end" value="17:00"></td>
                            <td><input type="time" class="form-control actual-start" value="08:00"></td>
                            <td><input type="time" class="form-control actual-end" value="18:00"></td>
                            <td class="scheduled-hours">0</td>
                            <td class="worked-hours">0</td>
                            <td class="ot-hours">0</td>
                        </tr>

                        <tr>
                            <td>Tuesday</td>
                            <td><input type="time" class="form-control sched-start" value="08:00"></td>
                            <td><input type="time" class="form-control sched-end" value="17:00"></td>
                            <td><input type="time" class="form-control actual-start"></td>
                            <td><input type="time" class="form-control actual-end"></td>
                            <td class="scheduled-hours">0</td>
                            <td class="worked-hours">0</td>
                            <td class="ot-hours">0</td>
                        </tr>

                        <tr>
                            <td>Wednesday</td>
                            <td><input type="time" class="form-control sched-start" value="08:00"></td>
                            <td><input type="time" class="form-control sched-end" value="17:00"></td>
                            <td><input type="time" class="form-control actual-start"></td>
                            <td><input type="time" class="form-control actual-end"></td>
                            <td class="scheduled-hours">0</td>
                            <td class="worked-hours">0</td>
                            <td class="ot-hours">0</td>
                        </tr>

                        <tr>
                            <td>Thursday</td>
                            <td><input type="time" class="form-control sched-start" value="08:00"></td>
                            <td><input type="time" class="form-control sched-end" value="17:00"></td>
                            <td><input type="time" class="form-control actual-start"></td>
                            <td><input type="time" class="form-control actual-end"></td>
                            <td class="scheduled-hours">0</td>
                            <td class="worked-hours">0</td>
                            <td class="ot-hours">0</td>
                        </tr>

                        <tr>
                            <td>Friday</td>
                            <td><input type="time" class="form-control sched-start" value="08:00"></td>
                            <td><input type="time" class="form-control sched-end" value="17:00"></td>
                            <td><input type="time" class="form-control actual-start"></td>
                            <td><input type="time" class="form-control actual-end"></td>
                            <td class="scheduled-hours">0</td>
                            <td class="worked-hours">0</td>
                            <td class="ot-hours">0</td>
                        </tr>

                        <tr>
                            <td>Saturday</td>
                            <td><input type="time" class="form-control sched-start" value="09:00"></td>
                            <td><input type="time" class="form-control sched-end" value="15:00"></td>
                            <td><input type="time" class="form-control actual-start"></td>
                            <td><input type="time" class="form-control actual-end"></td>
                            <td class="scheduled-hours">0</td>
                            <td class="worked-hours">0</td>
                            <td class="ot-hours">0</td>
                        </tr>

                        <tr>
                            <td>Sunday</td>
                            <td><input type="time" class="form-control sched-start" value="09:00"></td>
                            <td><input type="time" class="form-control sched-end" value="12:00"></td>
                            <td><input type="time" class="form-control actual-start"></td>
                            <td><input type="time" class="form-control actual-end"></td>
                            <td class="scheduled-hours">0</td>
                            <td class="worked-hours">0</td>
                            <td class="ot-hours">0</td>
                        </tr>

                    </tbody>

                </table>

            </div>

            <hr>

            <div class="row text-center">

                <div class="col-md-3">
                    <div class="card">
                        <div class="card-body">
                            <h6>Hourly Rate</h6>
                            <h3 id="hourlyRate">0.00</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card">
                        <div class="card-body">
                            <h6>Total Scheduled</h6>
                            <h3 id="totalScheduled">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card">
                        <div class="card-body">
                            <h6>Total OT Hours</h6>
                            <h3 id="totalOT">0</h3>
                        </div>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card border-success">
                        <div class="card-body">
                            <h6>OT Amount</h6>
                            <h3 id="otAmount">K0.00</h3>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

</div>

<script>

function timeToHours(time) {

    if (!time) return 0;

    const [hours, minutes] = time.split(':').map(Number);

    return hours + (minutes / 60);
}

function calculateOvertime() {

    const basicPay =
        parseFloat(document.getElementById('basicPay').value) || 0;

    const multiplier =
        parseFloat(document.getElementById('otMultiplier').value) || 1.5;

    let totalScheduledHours = 0;
    let totalWorkedHours = 0;
    let totalOTHours = 0;

    document.querySelectorAll('tbody tr').forEach(row => {

        const schedStart =
            row.querySelector('.sched-start').value;

        const schedEnd =
            row.querySelector('.sched-end').value;

        const actualStart =
            row.querySelector('.actual-start').value;

        const actualEnd =
            row.querySelector('.actual-end').value;

        const scheduledHours =
            timeToHours(schedEnd) -
            timeToHours(schedStart);

        let workedHours = 0;

        if (actualStart && actualEnd) {
            workedHours =
                timeToHours(actualEnd) -
                timeToHours(actualStart);
        }

        const overtimeHours =
            Math.max(0, workedHours - scheduledHours);

        row.querySelector('.scheduled-hours')
            .innerText = scheduledHours.toFixed(2);

        row.querySelector('.worked-hours')
            .innerText = workedHours.toFixed(2);

        row.querySelector('.ot-hours')
            .innerText = overtimeHours.toFixed(2);

        totalScheduledHours += scheduledHours;
        totalWorkedHours += workedHours;
        totalOTHours += overtimeHours;
    });

    const hourlyRate =
        basicPay / totalScheduledHours;

    const overtimeAmount =
        totalOTHours *
        hourlyRate *
        multiplier;

    document.getElementById('hourlyRate')
        .innerText = hourlyRate.toFixed(2);

    document.getElementById('totalScheduled')
        .innerText = totalScheduledHours.toFixed(2);

    document.getElementById('totalOT')
        .innerText = totalOTHours.toFixed(2);

    document.getElementById('otAmount')
        .innerText = 'K' + overtimeAmount.toFixed(2);
}

</script>

</body>
</html>
